<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS Services Quiz</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f1923;
    color: #e8eaed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  #app { width: 100%; max-width: 760px; }

  /* ---- SETUP SCREEN ---- */
  .setup-card {
    background: #1a2535;
    border-radius: 16px;
    padding: 48px 40px;
    text-align: center;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }
  .setup-card .logo {
    font-size: 48px;
    margin-bottom: 12px;
  }
  .setup-card h1 {
    font-size: 2rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 8px;
  }
  .setup-card .subtitle {
    color: #8a9bb0;
    font-size: 1rem;
    margin-bottom: 36px;
  }
  .setup-card label {
    display: block;
    font-size: 0.9rem;
    font-weight: 600;
    color: #FF9900;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }
  .count-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-bottom: 36px;
  }
  .count-btn {
    background: #243347;
    border: 2px solid #2e4060;
    color: #c8d6e5;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    min-width: 90px;
  }
  .count-btn:hover { border-color: #FF9900; color: #fff; }
  .count-btn.selected { background: #FF9900; border-color: #FF9900; color: #0f1923; }

  .start-btn {
    background: #FF9900;
    color: #0f1923;
    border: none;
    padding: 14px 48px;
    border-radius: 10px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .start-btn:hover { background: #e68a00; transform: translateY(-1px); }
  .start-btn:active { transform: translateY(0); }

  .stats-row {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-top: 32px;
    padding-top: 28px;
    border-top: 1px solid #243347;
  }
  .stat { text-align: center; }
  .stat .num { font-size: 1.6rem; font-weight: 700; color: #FF9900; }
  .stat .lbl { font-size: 0.75rem; color: #8a9bb0; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }

  /* ---- QUIZ SCREEN ---- */
  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .q-counter { font-size: 0.9rem; color: #8a9bb0; font-weight: 600; }
  .q-score { font-size: 0.9rem; color: #FF9900; font-weight: 700; }

  .progress-bar {
    background: #1a2535;
    border-radius: 99px;
    height: 6px;
    margin-bottom: 28px;
    overflow: hidden;
  }
  .progress-fill {
    background: #FF9900;
    height: 100%;
    border-radius: 99px;
    transition: width 0.3s ease;
  }

  .quiz-card {
    background: #1a2535;
    border-radius: 16px;
    padding: 36px 40px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    margin-bottom: 16px;
  }
  .category-tag {
    display: inline-block;
    background: #243347;
    color: #FF9900;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 6px;
    margin-bottom: 16px;
  }
  .question-text {
    font-size: 1.15rem;
    font-weight: 600;
    color: #fff;
    line-height: 1.6;
    margin-bottom: 28px;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #243347;
    border: 2px solid #2e4060;
    border-radius: 10px;
    padding: 14px 18px;
    cursor: pointer;
    text-align: left;
    color: #c8d6e5;
    font-size: 0.95rem;
    line-height: 1.4;
    transition: all 0.12s;
  }
  .option-btn:hover:not(:disabled) { border-color: #FF9900; color: #fff; }
  .option-btn:disabled { cursor: default; }

  .option-letter {
    min-width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #2e4060;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    color: #8a9bb0;
    flex-shrink: 0;
    transition: all 0.12s;
  }

  .option-btn.correct { background: #0d3d2a; border-color: #2ecc71; color: #fff; }
  .option-btn.correct .option-letter { background: #2ecc71; color: #0f1923; }
  .option-btn.wrong { background: #3d1515; border-color: #e74c3c; color: #fff; }
  .option-btn.wrong .option-letter { background: #e74c3c; color: #fff; }
  .option-btn.selected-wrong { background: #3d1515; border-color: #e74c3c; color: #fff; }
  .option-btn.reveal-correct { background: #0d3d2a; border-color: #2ecc71; color: #fff; }

  .quiz-footer {
    display: flex;
    justify-content: flex-end;
  }
  .next-btn {
    background: #FF9900;
    color: #0f1923;
    border: none;
    padding: 13px 36px;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }
  .next-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .next-btn:not(:disabled):hover { background: #e68a00; }

  /* ---- SUMMARY SCREEN ---- */
  .summary-card {
    background: #1a2535;
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }
  .summary-card h2 { font-size: 1.6rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
  .summary-card .sub { color: #8a9bb0; margin-bottom: 28px; }

  .score-circle-wrap { display: flex; justify-content: center; margin-bottom: 32px; }
  .score-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 6px solid #FF9900;
    background: #243347;
  }
  .score-circle .big { font-size: 2.2rem; font-weight: 800; color: #FF9900; line-height: 1; }
  .score-circle .pct { font-size: 0.85rem; color: #8a9bb0; margin-top: 2px; }

  .score-stats {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-bottom: 32px;
  }
  .score-stat {
    flex: 1;
    max-width: 180px;
    background: #243347;
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }
  .score-stat .num { font-size: 1.8rem; font-weight: 800; }
  .score-stat .lbl { font-size: 0.75rem; color: #8a9bb0; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
  .score-stat.correct .num { color: #2ecc71; }
  .score-stat.wrong .num { color: #e74c3c; }

  .breakdown-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: #8a9bb0;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }

  .breakdown-list { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; padding-right: 4px; margin-bottom: 28px; }
  .breakdown-list::-webkit-scrollbar { width: 4px; }
  .breakdown-list::-webkit-scrollbar-track { background: #243347; border-radius: 4px; }
  .breakdown-list::-webkit-scrollbar-thumb { background: #FF9900; border-radius: 4px; }

  .breakdown-item {
    background: #243347;
    border-radius: 10px;
    padding: 14px 16px;
    border-left: 4px solid transparent;
  }
  .breakdown-item.ok { border-left-color: #2ecc71; }
  .breakdown-item.bad { border-left-color: #e74c3c; }
  .bi-q { font-size: 0.9rem; color: #c8d6e5; margin-bottom: 6px; font-weight: 500; }
  .bi-answers { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.8rem; }
  .bi-your { color: #8a9bb0; }
  .bi-your span { color: #e74c3c; font-weight: 600; }
  .bi-your.was-correct span { color: #2ecc71; }
  .bi-correct { color: #8a9bb0; }
  .bi-correct span { color: #2ecc71; font-weight: 600; }
  .bi-icon { font-size: 1.1rem; margin-left: auto; }

  .summary-actions { display: flex; gap: 12px; justify-content: center; }
  .retake-btn {
    background: #FF9900;
    color: #0f1923;
    border: none;
    padding: 13px 36px;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  .retake-btn:hover { background: #e68a00; }

  /* ---- STUDY MODE ---- */
  .study-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .study-header h2 { font-size: 1.4rem; font-weight: 700; color: #fff; }
  .study-header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .ghost-btn {
    background: transparent;
    color: #8a9bb0;
    border: 2px solid #2e4060;
    padding: 10px 22px;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .ghost-btn:hover { border-color: #FF9900; color: #fff; }

  .study-filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }
  .filter-pill {
    background: #243347;
    border: 2px solid #2e4060;
    color: #8a9bb0;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.12s;
    white-space: nowrap;
  }
  .filter-pill:hover { border-color: #FF9900; color: #fff; }
  .filter-pill.active { background: #FF9900; border-color: #FF9900; color: #0f1923; }

  .study-count {
    font-size: 0.82rem;
    color: #8a9bb0;
    margin-bottom: 14px;
  }

  .study-list { display: flex; flex-direction: column; gap: 10px; }

  .study-item {
    background: #1a2535;
    border-radius: 12px;
    padding: 18px 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  .study-item-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 12px;
  }
  .study-q-num {
    min-width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #243347;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 700;
    color: #8a9bb0;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .study-q-text { font-size: 0.95rem; font-weight: 600; color: #fff; line-height: 1.5; flex: 1; }
  .study-options { display: flex; flex-direction: column; gap: 6px; margin-left: 36px; }
  .study-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    color: #8a9bb0;
    background: #243347;
  }
  .study-option.is-correct {
    background: #0d3d2a;
    color: #fff;
    font-weight: 600;
  }
  .study-option-letter {
    min-width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #2e4060;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.68rem;
    font-weight: 700;
    color: #8a9bb0;
    flex-shrink: 0;
  }
  .study-option.is-correct .study-option-letter {
    background: #2ecc71;
    color: #0f1923;
  }
  .study-option-check { margin-left: auto; font-size: 0.85rem; flex-shrink: 0; }

  @media (max-width: 500px) {
    .quiz-card, .setup-card, .summary-card { padding: 24px 20px; }
    .setup-card h1 { font-size: 1.5rem; }
    .question-text { font-size: 1rem; }
    .study-options { margin-left: 0; }
  }
</style>
</head>
<body>

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickDistractors(correctService, count, pool) {
  // prefer same category first, then any
  const sameCat = pool.filter(s => s.id !== correctService.id && s.category === correctService.category);
  const otherCat = pool.filter(s => s.id !== correctService.id && s.category !== correctService.category);
  const ordered = shuffle(sameCat).concat(shuffle(otherCat));
  return ordered.slice(0, count);
}

function makeOptions(correctText, distractorTexts) {
  const options = [
    { text: correctText, correct: true },
    ...distractorTexts.map(t => ({ text: t, correct: false }))
  ];
  return shuffle(options);
}

        'Lambda scales automatically and you pay only for the compute time your code consumes.',
        ['Lambda requires you to provision and manage the underlying EC2 instances.',
         'Lambda functions can run indefinitely with no maximum execution time limit.',
         'Lambda only supports Python and Node.js as runtimes.']) },
    { category:'Storage',
      question:'Which statement about Amazon S3 is TRUE?',
      options: makeOptions(
        'S3 stores objects with 11 nines (99.999999999%) of durability by default.',
        ['S3 is a block storage service designed for attaching to EC2 instances.',
         'S3 objects can only be accessed from within a VPC.',
         'S3 has a maximum file size of 1 GB per object.']) },
    { category:'Databases',
      question:'Which statement about Amazon DynamoDB is TRUE?',
      options: makeOptions(
        'DynamoDB is a fully managed NoSQL database that delivers single-digit millisecond performance at any scale.',
        ['DynamoDB supports complex SQL JOINs across multiple tables natively.',
         'DynamoDB requires you to choose a fixed instance size when creating a table.',
         'DynamoDB is only available in a single AWS Region at a time.']) },
    { category:'Security',
      question:'Which statement about AWS IAM is TRUE?',
      options: makeOptions(
        'IAM is a global service — users, roles, and policies are not region-specific.',
        ['IAM users are region-scoped and must be created separately per region.',
         'IAM automatically rotates all user passwords every 90 days.',
         'IAM roles can only be assumed by human users, not AWS services.']) },
    { category:'Networking',
      question:'Which statement about Amazon CloudFront is TRUE?',
      options: makeOptions(
        'CloudFront caches content at edge locations worldwide to reduce latency for end users.',
        ['CloudFront can only serve content stored in Amazon S3.',
         'CloudFront is a DNS service that routes users to the nearest AWS region.',
         'CloudFront requires an EC2 origin and does not support S3 as an origin.']) },
    { category:'Compute',
      question:'Which statement about Amazon EC2 Spot Instances is TRUE?',
      options: makeOptions(
        'Spot Instances use spare EC2 capacity and can be interrupted by AWS with a 2-minute warning.',
        ['Spot Instances offer no discount compared to On-Demand pricing.',
         'Spot Instances are guaranteed never to be interrupted once launched.',
         'Spot Instances require a 1-year or 3-year commitment to use.']) },
    { category:'Monitoring & Observability',
      question:'Which statement about AWS CloudTrail is TRUE?',
      options: makeOptions(
        'CloudTrail logs management API calls by default and can optionally log data events like S3 object access.',
        ['CloudTrail monitors CPU and memory metrics for EC2 instances.',
         'CloudTrail only captures failed API calls, not successful ones.',
         'CloudTrail logs are only retained for 24 hours unless manually exported.']) },
    { category:'Security',
      question:'Which statement about AWS KMS is TRUE?',
      options: makeOptions(
        'KMS manages encryption keys and integrates with most AWS services for server-side encryption.',
        ['KMS stores application secrets like database passwords and API keys with auto-rotation.',
         'KMS issues SSL/TLS certificates for use with HTTPS endpoints.',
         'KMS keys are automatically shared across all AWS accounts in an organization.']) },
    { category:'Application Integration',
      question:'Which statement about Amazon SQS is TRUE?',
      options: makeOptions(
        'SQS is a fully managed message queue where each message is delivered to one consumer.',
        ['SQS delivers each message to all subscribers simultaneously (fan-out model).',
         'SQS requires you to manage the underlying message broker infrastructure.',
         'SQS only supports FIFO queues; standard queues are not available.']) },
    { category:'Cost Optimization',
      question:'Which statement about AWS Spot Instances is TRUE?',
      options: makeOptions(
        'Spot Instances can offer discounts of up to 90% compared to On-Demand pricing for the same instance.',
        ['Spot Instances are more expensive than On-Demand but offer better performance guarantees.',
         'Spot Instances are only available in the us-east-1 region.',
         'Spot Instances have a fixed price set by AWS that never fluctuates.']) },
    { category:'Networking',
      question:'Which statement about Amazon VPC is TRUE?',
      options: makeOptions(
        'Each VPC is logically isolated from other VPCs and the internet unless you explicitly configure connectivity.',
        ['A VPC spans multiple AWS accounts by default without any configuration.',
         'You can only create one VPC per AWS region.',
         'VPCs automatically peer with each other using VPC peering without configuration.']) },
    { category:'Machine Learning',
      question:'Which statement about Amazon Bedrock is TRUE?',
      options: makeOptions(
        'Bedrock provides access to foundation models from multiple providers via API, without managing any ML infrastructure.',
        ['Bedrock requires you to train your own foundation model from scratch before use.',
         'Bedrock only supports Amazon\'s own Titan models and no third-party models.',
         'Bedrock is a service specifically for image recognition and object detection only.']) },
  ];
  typeK.forEach((q, i) => questions.push({ id:`K-${i}`, ...q }));

  return shuffle(questions);
}

// ============================================================
// APP STATE
// ============================================================
const COUNTS = [10, 20, 30, 50, 'All'];
const BANK_SIZE = buildQuestionBank().length;

let state = {
  phase: 'setup',    // 'setup' | 'quiz' | 'summary' | 'study'
  selectedCount: 20,
  allQuestions: [],
  questions: [],     // active question set for this session
  current: 0,
  answers: [],       // { question, chosen, correct, wasCorrect }
  answered: false,
  studyFilter: 'All',
};

// ============================================================
// RENDER
// ============================================================
function render() {
  const app = document.getElementById('app');
  if (state.phase === 'setup') app.innerHTML = renderSetup();
  else if (state.phase === 'quiz') app.innerHTML = renderQuiz();
  else if (state.phase === 'study') app.innerHTML = renderStudy();
  else app.innerHTML = renderSummary();
  attachListeners();
}

function renderSetup() {
  return `
    <div class="setup-card">
      <div class="logo">☁️</div>
      <h1>AWS Services Quiz</h1>
      <p class="subtitle">Test your knowledge of all 108 AWS services across 15 categories</p>
      <label>How many questions?</label>
      <div class="count-grid">
        ${COUNTS.map(c => `
          <button class="count-btn ${state.selectedCount === c ? 'selected' : ''}" data-count="${c}">
            ${c === 'All' ? 'All (' + BANK_SIZE + ')' : c}
          </button>
        `).join('')}
      </div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <button class="start-btn" id="startBtn">Start Quiz →</button>
        <button class="start-btn" id="studyBtn" style="background:#243347;color:#FF9900;border:2px solid #FF9900;">📖 Study Mode</button>
      </div>
      <div class="stats-row">
        <div class="stat"><div class="num">108</div><div class="lbl">Services</div></div>
        <div class="stat"><div class="num">15</div><div class="lbl">Categories</div></div>
        <div class="stat"><div class="num">${BANK_SIZE}</div><div class="lbl">Questions</div></div>
      </div>
    </div>`;
}

function renderQuiz() {
  const q = state.questions[state.current];
  const total = state.questions.length;
  const pct = Math.round((state.current / total) * 100);
  const letters = ['A', 'B', 'C', 'D'];

  const optionsHtml = q.options.map((opt, i) => {
    let cls = 'option-btn';
    if (state.answered) {
      if (opt.correct) cls += ' correct';
      else if (i === state.chosenIndex) cls += ' wrong';
    }
    return `
      <button class="option-btn ${state.answered ? (opt.correct ? 'correct' : (i === state.chosenIndex ? 'wrong' : '')) : ''}"
              data-idx="${i}" ${state.answered ? 'disabled' : ''}>
        <span class="option-letter">${letters[i]}</span>
        <span>${opt.text}</span>
      </button>`;
  }).join('');

  const score = state.answers.filter(a => a.wasCorrect).length;

  return `
    <div class="quiz-header">
      <span class="q-counter">Question ${state.current + 1} of ${total}</span>
      <span class="q-score">Score: ${score} / ${state.current}</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="quiz-card">
      <span class="category-tag">${q.category}</span>
      <div class="question-text">${q.question}</div>
      <div class="options">${optionsHtml}</div>
    </div>
    <div class="quiz-footer">
      <button class="next-btn" id="nextBtn" ${!state.answered ? 'disabled' : ''}>
        ${state.current + 1 === total ? 'See Results' : 'Next →'}
      </button>
    </div>`;
}

function renderSummary() {
  const total = state.answers.length;
  const correct = state.answers.filter(a => a.wasCorrect).length;
  const wrong = total - correct;
  const pct = Math.round((correct / total) * 100);

  const breakdownHtml = state.answers.map((a, i) => {
    const yourText = a.chosen ? a.chosen.text : '(not answered)';
    const correctText = a.options.find(o => o.correct).text;
    return `
      <div class="breakdown-item ${a.wasCorrect ? 'ok' : 'bad'}">
        <div class="bi-q">${i + 1}. ${a.question}</div>
        <div class="bi-answers">
          <span class="bi-your ${a.wasCorrect ? 'was-correct' : ''}">Your answer: <span>${yourText}</span></span>
          ${!a.wasCorrect ? `<span class="bi-correct">Correct: <span>${correctText}</span></span>` : ''}
          <span class="bi-icon">${a.wasCorrect ? '✅' : '❌'}</span>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="summary-card">
      <h2>Quiz Complete!</h2>
      <p class="sub">Here's how you did</p>
      <div class="score-circle-wrap">
        <div class="score-circle">
          <span class="big">${pct}%</span>
          <span class="pct">${correct} / ${total}</span>
        </div>
      </div>
      <div class="score-stats">
        <div class="score-stat correct">
          <div class="num">${correct}</div>
          <div class="lbl">Correct</div>
        </div>
        <div class="score-stat wrong">
          <div class="num">${wrong}</div>
          <div class="lbl">Wrong</div>
        </div>
      </div>
      <div class="breakdown-title">Answer Breakdown</div>
      <div class="breakdown-list">${breakdownHtml}</div>
      <div class="summary-actions">
        <button class="retake-btn" id="retakeBtn">↩ Retake Quiz</button>
        <button class="retake-btn" id="studyFromSummaryBtn" style="background:#243347;color:#FF9900;border:2px solid #FF9900;">📖 Study Mode</button>
      </div>
    </div>`;
}

function renderStudy() {
  if (state.allQuestions.length === 0) state.allQuestions = buildQuestionBank();

  const allCats = ['All', ...CATEGORIES];
  const filtered = state.studyFilter === 'All'
    ? state.allQuestions
    : state.allQuestions.filter(q => q.category === state.studyFilter);

  const filterHtml = allCats.map(c => `
    <button class="filter-pill ${state.studyFilter === c ? 'active' : ''}" data-cat="${c}">${c}</button>
  `).join('');

  const listHtml = filtered.map((q, i) => {
    const correctText = q.options.find(o => o.correct).text;
    return `
      <div class="study-item">
        <div class="study-item-header">
          <span class="study-q-num">${i + 1}</span>
          <div>
            <span class="category-tag" style="margin-bottom:6px;display:inline-block;">${q.category}</span>
            <div class="study-q-text">${q.question}</div>
          </div>
        </div>
        <div class="study-options">
          <div class="study-option is-correct">
            <span class="study-option-letter">✓</span>
            <span>${correctText}</span>
          </div>
        </div>
      </div>`;
  }).join('');

  return `
    <div class="study-header">
      <h2>📖 Study Mode</h2>
      <div class="study-header-actions">
        <button class="ghost-btn" id="backToSetupBtn">← Back to Home</button>
        <button class="start-btn" id="goQuizBtn" style="padding:10px 24px;font-size:0.9rem;">Start Quiz →</button>
      </div>
    </div>
    <div class="study-filter-bar">${filterHtml}</div>
    <div class="study-count">Showing ${filtered.length} of ${state.allQuestions.length} questions</div>
    <div class="study-list">${listHtml}</div>`;
}

// ============================================================
// EVENT LISTENERS
// ============================================================
function attachListeners() {
  if (state.phase === 'setup') {
    document.querySelectorAll('.count-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.dataset.count;
        state.selectedCount = val === 'All' ? 'All' : parseInt(val, 10);
        render();
      });
    });
    document.getElementById('startBtn').addEventListener('click', startQuiz);
    document.getElementById('studyBtn').addEventListener('click', () => {
      if (state.allQuestions.length === 0) state.allQuestions = buildQuestionBank();
      state.phase = 'study';
      state.studyFilter = 'All';
      render();
    });
  }

  if (state.phase === 'study') {
    document.getElementById('backToSetupBtn').addEventListener('click', () => {
      state.phase = 'setup';
      render();
    });
    document.getElementById('goQuizBtn').addEventListener('click', startQuiz);
    document.querySelectorAll('.filter-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        state.studyFilter = pill.dataset.cat;
        render();
      });
    });
  }

  if (state.phase === 'quiz') {
    if (!state.answered) {
      document.querySelectorAll('.option-btn').forEach((btn, i) => {
        btn.addEventListener('click', () => selectAnswer(i));
      });
    }
    const nextBtn = document.getElementById('nextBtn');
    if (nextBtn && state.answered) {
      nextBtn.addEventListener('click', nextQuestion);
    }
  }

  if (state.phase === 'summary') {
    document.getElementById('retakeBtn').addEventListener('click', () => {
      state.phase = 'setup';
      state.answers = [];
      state.current = 0;
      state.answered = false;
      render();
    });
    document.getElementById('studyFromSummaryBtn').addEventListener('click', () => {
      state.phase = 'study';
      state.studyFilter = 'All';
      render();
    });
  }
}

// ============================================================
// ACTIONS
// ============================================================
function startQuiz() {
  if (state.allQuestions.length === 0) {
    state.allQuestions = buildQuestionBank();
  }
  const count = state.selectedCount === 'All' ? state.allQuestions.length : state.selectedCount;
  // rebuild shuffled questions each time
  const fresh = buildQuestionBank();
  state.questions = fresh.slice(0, Math.min(count, fresh.length));
  state.current = 0;
  state.answers = [];
  state.answered = false;
  state.phase = 'quiz';
  render();
}

function selectAnswer(idx) {
  if (state.answered) return;
  const q = state.questions[state.current];
  const chosen = q.options[idx];
  const wasCorrect = chosen.correct;

  state.chosenIndex = idx;
  state.answered = true;
  state.answers.push({
    question: q.question,
    category: q.category,
    options: q.options,
    chosen,
    wasCorrect,
  });
  render();
}

function nextQuestion() {
  if (state.current + 1 >= state.questions.length) {
    state.phase = 'summary';
    render();
    return;
  }
  state.current++;
  state.answered = false;
  state.chosenIndex = null;
  render();
}

// ============================================================
// BOOT
// ============================================================
render();
</script>
</body>
</html>
